<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste API Configurações</title>
</head>
<body>
    <h1>🧪 Teste da API de Configurações</h1>
    
    <div>
        <h2>1️⃣ Teste GET</h2>
        <button onclick="testGet()">Testar GET /api/settings</button>
        <div id="getResult"></div>
    </div>

    <div>
        <h2>2️⃣ Teste POST (sem autenticação)</h2>
        <button onclick="testPostWithoutAuth()">Testar POST sem auth</button>
        <div id="postResult"></div>
    </div>

    <div>
        <h2>3️⃣ Teste POST (com autenticação)</h2>
        <button onclick="testPostWithAuth()">Testar POST com auth</button>
        <div id="authResult"></div>
    </div>

    <script>
        async function testGet() {
            try {
                const response = await fetch('/api/settings');
                const data = await response.json();
                document.getElementById('getResult').innerHTML = `
                    <p>✅ Status: ${response.status}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('getResult').innerHTML = `
                    <p>❌ Erro: ${error.message}</p>
                `;
            }
        }

        async function testPostWithoutAuth() {
            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'test@test.com',
                        phone: '+244 123 456 789',
                        location: 'Test Location'
                    })
                });
                const data = await response.json();
                document.getElementById('postResult').innerHTML = `
                    <p>Status: ${response.status}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('postResult').innerHTML = `
                    <p>❌ Erro: ${error.message}</p>
                `;
                `;
            }
        }

        async function testPostWithAuth() {
            try {
                // Primeiro fazer login
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@superbeast.com',
                        password: 'admin123'
                    })
                });

                if (loginResponse.ok) {
                    const loginData = await loginResponse.json();
                    document.getElementById('authResult').innerHTML = `
                        <p>✅ Login bem-sucedido!</p>
                        <p>Token: ${loginData.token || 'Cookie definido'}</p>
                    `;

                    // Agora testar POST com autenticação
                    const postResponse = await fetch('/api/settings', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: 'admin@superbeast.com',
                            phone: '+244 123 456 789',
                            location: 'Luanda, Angola',
                            workingHours: 'Seg-Sex: 08:00-18:00',
                            companyName: 'Super Beast - Fit Em 14 Semanas',
                            description: 'Transformamos equipas através do fitness, entretenimento e desenvolvimento pessoal em Angola.'
                        })
                    });

                    const postData = await postResponse.json();
                    document.getElementById('authResult').innerHTML += `
                        <p>Status POST: ${postResponse.status}</p>
                        <pre>${JSON.stringify(postData, null, 2)}</pre>
                    `;
                } else {
                    document.getElementById('authResult').innerHTML = `
                        <p>❌ Falha no login: ${loginResponse.status}</p>
                    `;
                }
            } catch (error) {
                document.getElementById('authResult').innerHTML = `
                    <p>❌ Erro: ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
